spring.application.name=ebms

server.port=5000

spring.datasource.url=jdbc:mysql://mysql-1fd78a14-ebms-db.e.aivencloud.com:13251/employees?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-397c2bb3-nleitefaria-b640.e.aivencloud.com:19080}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:avnadmin}" password="${KAFKA_PASSWORD:}";
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_CERT_PATH:/etc/ssl/certs/ca-certificates.crt}
app.kafka.topics.employee-events=${KAFKA_EMPLOYEE_EVENTS_TOPIC:employee-events}
app.kafka.topics.title-events=${KAFKA_TITLE_EVENTS_TOPIC:title-events}